[package]
name = "rust-in-space"
version = "0.2.0"
edition = "2021"

[dependencies]
gltf = { version = "1.4", default-features = false, features = ["utils"] }
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-locale = "0.3.2"

[build-dependencies]
image = { version = "0.24", default-features = false, features = ["png"] }
